name: Keep community backend awake

# Supabase pauses free projects after a week without requests; one read a day prevents that.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(jq -r '.supabaseUrl // ""' community/config.json)
          key=$(jq -r '.supabaseAnonKey // ""' community/config.json)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "Supabase not configured yet - nothing to ping."; exit 0; fi
          curl -fsS "$url/rest/v1/open_suggestions?select=id&limit=1" -H "apikey: $key" > /dev/null
          echo "Supabase answered."
