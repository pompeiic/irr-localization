name: Validate translations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Structure + translation checks
        if: github.event_name == 'push'
        run: node scripts/validate.mjs
      - name: Translation-only pull request
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --base "${{ github.base_ref }}"
