<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRR Localization</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; background: #15171a; color: #d8dade; margin: 2rem; }
  h1 { font-size: 18px; margin: 0 0 .25rem; }
  .muted { color: #8a8f98; }
  table { border-collapse: collapse; margin-top: 1rem; }
  th, td { padding: .3rem .8rem; border-bottom: 1px solid #2a2d33; text-align: left; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; height: 6px; background: #4c8bf5; vertical-align: middle; margin-left: .4rem; }
</style>
</head>
<body>
<h1>IRR Localization — progress</h1>
<div class="muted" id="meta">Loading…</div>
<table id="table"></table>
<script>
// Read-only overview until the editor lands; reads the Unreal-exported Project.json.
fetch("Project.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("No export yet — run IRR -> Sync Translations (Full) in Unreal."); return r.json(); })
  .then((p) => {
    document.getElementById("meta").textContent =
      `${p.entries} strings in ${p.areas.length} areas · source ${p.nativeCulture} · exported ${new Date(p.exportedAt).toLocaleString()}`;
    const head = `<tr><th>Area</th><th>Strings</th>${p.cultures.map((c) => `<th>${c}</th>`).join("")}</tr>`;
    const rows = p.areas.map((a) => `<tr><td>${a.area}</td><td class="num">${a.entries}</td>${p.cultures.map((c) => {
      const pct = a.entries ? Math.round(100 * (a.translated[c] || 0) / a.entries) : 0;
      return `<td class="num">${pct}%<span class="bar" style="width:${pct * 0.6}px"></span></td>`;
    }).join("")}</tr>`);
    document.getElementById("table").innerHTML = head + rows.join("");
  })
  .catch((e) => { document.getElementById("meta").textContent = e.message; });
</script>
</body>
</html>
