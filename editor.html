<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incursion Red River — Translations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header>
  <h1>Translations<small>Incursion Red River</small></h1>
  <div class="spacer"></div>
  <select id="culture" title="Language you are translating into"></select>
  <button id="adminBtn" class="ghost" hidden>Admin</button>
  <div id="account">
    <button id="signInBtn" class="discord">Sign in with Discord</button>
    <button id="accountBtn" class="ghost" hidden></button>
    <div id="accountMenu" hidden>
      <div class="who" id="accountWho"></div>
      <button id="copyIdBtn" class="ghost small">Copy user id</button>
      <button id="signOutBtn" class="ghost small">Sign out</button>
    </div>
  </div>
</header>
<main>
  <div id="sidebar">
    <div class="side-h">Workspace</div>
    <div id="views"></div>
    <div class="side-h">Categories</div>
    <div id="categoryList"></div>
    <div id="adminNav" hidden>
      <div class="side-h">Admin</div>
      <div id="adminViews"></div>
    </div>
  </div>

  <div id="content">
    <div id="toolbar">
      <div class="trow">
        <input type="search" id="search" placeholder="Search English or translation…">
      </div>
      <details id="guide">
        <summary>How reviewing works</summary>
        <div id="guideBody"></div>
      </details>
      <div id="countline" aria-live="polite">Loading…</div>
      <div id="selbar" hidden></div>
      <div id="notice" hidden></div>
    </div>
    <div id="listWrap"></div>
    <div id="adminView" hidden></div>
  </div>
</main>
<script type="module" src="editor.js"></script>
</body>
</html>
